name: Build APK

# Fork-only workflow: builds an installable debug APK of the `foss` flavour on
# every push to any branch (and on demand from the Actions tab), and uploads it
# as a run artifact. The debug build carries the `.debug` applicationId suffix,
# so it installs next to a Play / F-Droid copy instead of replacing it.
# It deliberately runs no quality gate — that is `check.yml`'s job.

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: assembleFossDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build foss debug APK
        run: ./gradlew :app:assembleFossDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: knotwork-foss-debug-run${{ github.run_number }}
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
